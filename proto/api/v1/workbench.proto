edition = "2023";

package api.v1;

import "api/v1/architecture_graph.proto";
import "api/v1/sparse_bitset.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/GoogleCloudPlatform/khi/pkg/generated/api/v1;apiv1";

// WorkbenchService manages in-memory analysis sessions for .khi datasets.
service WorkbenchService {
  // Opens or attaches to an in-memory Workbench session with real-time loading progress streaming.
  rpc OpenWorkbench(OpenWorkbenchRequest) returns (stream OpenWorkbenchResponse);

  // Opens or polls loading progress of a Workbench session without streaming.
  rpc OpenWorkbenchSync(OpenWorkbenchSyncRequest) returns (OpenWorkbenchSyncResponse);

  // Cancels an in-progress synchronous workbench open task.
  rpc CancelOpenWorkbenchSync(CancelOpenWorkbenchSyncRequest) returns (CancelOpenWorkbenchSyncResponse);

  // Watches the search index construction progress and status for an inspection dataset. The server terminates the stream every 30s to accommodate proxy timeouts, and clients are expected to reconnect.
  rpc WatchIndexProgress(WatchIndexProgressRequest) returns (stream WatchIndexProgressResponse);

  // Pulls the search index construction progress and status snapshot without opening a persistent stream.
  rpc PullIndexProgress(PullIndexProgressRequest) returns (PullIndexProgressResponse);

  // Sends periodic heartbeat to keep the Workbench session alive in memory.
  rpc HeartbeatWorkbench(HeartbeatWorkbenchRequest) returns (HeartbeatWorkbenchResponse);

  // Decodes an interned struct by ID and returns its formatted YAML string.
  rpc ReadStructYAML(ReadStructYAMLRequest) returns (ReadStructYAMLResponse);

  // Evaluates a timeline and log filtering pipeline on the server and streams progress updates followed by the final matched ID sets.
  rpc FilterTimeline(FilterTimelineRequest) returns (stream FilterTimelineResponse);

  // Evaluates a timeline and log filtering pipeline synchronously or polls its in-progress status.
  rpc FilterTimelineSync(FilterTimelineSyncRequest) returns (FilterTimelineSyncResponse);

  // Cancels an in-progress synchronous timeline filtering task.
  rpc CancelFilterTimelineSync(CancelFilterTimelineSyncRequest) returns (CancelFilterTimelineSyncResponse);

  // Computes the Kubernetes architecture graph for a specific timestamp based on the active timeline filter.
  rpc GetArchitectureGraph(GetArchitectureGraphRequest) returns (GetArchitectureGraphResponse);
  // Explicitly closes and releases an active Workbench session.
  rpc CloseWorkbench(CloseWorkbenchRequest) returns (CloseWorkbenchResponse);
}

// Request to open or attach to a Workbench session for a specific inspection dataset.
message OpenWorkbenchRequest {
  // Unique persistent identifier for the user / client browser instance.
  string user_id = 1;
  // Session identifier matching the frontend route session ID.
  string session_id = 2;
  // The inspection ID to open.
  string inspection_id = 3;
}

// Streamed loading progress or completion status for OpenWorkbench.
message OpenWorkbenchResponse {
  // Execution phase of the dataset loading process.
  enum Stage {
    STAGE_UNSPECIFIED = 0;
    STAGE_INITIALIZING = 1;
    STAGE_READING_FILE = 2;
    STAGE_PARSING_CHUNKS = 3;
    STAGE_INDEXING_DATA = 4;
    STAGE_READY = 5;
  }
  Stage stage = 1;
  double progress_percentage = 2;
  string message = 3;

  // The active workbench ID assigned to this session.
  string workbench_id = 4;
}

// Request to open or poll loading progress of a Workbench session without streaming.
message OpenWorkbenchSyncRequest {
  // Unique persistent identifier for the user / client browser instance.
  string user_id = 1;
  // Session identifier matching the frontend route session ID.
  string session_id = 2;
  // The inspection ID to open.
  string inspection_id = 3;
  // Job identifier returned from a previous OpenWorkbenchSync call, if polling an ongoing task.
  string job_id = 4;
}

// Response containing current loading progress or completion status.
message OpenWorkbenchSyncResponse {
  // Unique job identifier tracking this opening task.
  string job_id = 1;
  // Execution phase of the dataset loading process.
  OpenWorkbenchResponse.Stage stage = 2;
  // Progress percentage (0 - 100).
  double progress_percentage = 3;
  // Detailed status description.
  string message = 4;
  // The active workbench ID assigned to this session once ready.
  string workbench_id = 5;
}

// Request to cancel an ongoing synchronous workbench open task.
message CancelOpenWorkbenchSyncRequest {
  // Unique persistent identifier for the user / client browser instance.
  string user_id = 1;
  // Session identifier matching the frontend route session ID.
  string session_id = 2;
  // Job identifier of the open task to cancel.
  string job_id = 3;
}

// Response confirming cancellation of the workbench open task.
message CancelOpenWorkbenchSyncResponse {
  // Whether the opening job was found and canceled.
  bool canceled = 1;
}

// Request to watch the search index construction progress of an active Workbench session.
message WatchIndexProgressRequest {
  // The active workbench session identifier to stream search index construction progress for.
  string workbench_id = 1;
}

// Progress update or terminal state of search index construction.
message WatchIndexProgressResponse {
  // Lifecycle state of search index construction.
  enum IndexState {
    INDEX_STATE_UNSPECIFIED = 0;
    INDEX_STATE_BUILDING = 1;
    INDEX_STATE_READY = 2;
    INDEX_STATE_FAILED = 3;
  }
  IndexState state = 1;
  double progress_percentage = 2;
  string message = 3;
}

// Request to pull search index construction progress without opening a persistent stream.
message PullIndexProgressRequest {
  // The active workbench session identifier.
  string workbench_id = 1;
}

// Response containing the search index construction progress snapshot.
message PullIndexProgressResponse {
  // Lifecycle state of search index construction.
  WatchIndexProgressResponse.IndexState state = 1;
  // Index construction progress percentage (0 - 100).
  double progress_percentage = 2;
  // Informational status message.
  string message = 3;
}

// Request to refresh the lease TTL of an active Workbench session.
message HeartbeatWorkbenchRequest {
  string workbench_id = 1;
}

// Response confirming heartbeat reception and updated lease expiration time.
message HeartbeatWorkbenchResponse {
  bool active = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Request to decode an interned struct into its YAML representation.
message ReadStructYAMLRequest {
  // The active workbench session identifier.
  string workbench_id = 1;
  // The unique ID of the interned struct to decode.
  uint32 struct_id = 2;
}

// Response containing the decoded YAML representation of the struct.
message ReadStructYAMLResponse {
  // The formatted YAML string representation of the requested struct.
  string yaml = 1;
}

// Request to execute a complete timeline and log filtering pipeline against an active Workbench dataset.
message FilterTimelineRequest {
  // The active workbench session identifier.
  string workbench_id = 1;
  // CEL expression to filter timelines by path, name, or metadata. Empty string matches all timelines.
  string timeline_query = 2;
  // CEL expression to exclude timelines and their descendants. Empty string excludes none.
  string timeline_exclusion_query = 3;
  // CEL expression to filter log entries within remaining timelines. Empty string matches all logs.
  string log_query = 4;
  // When true, excludes timelines that contain no matching log entries.
  bool exclude_no_logs = 5;
}

// Intermediate progress update emitted during filter pipeline execution.
message FilterProgress {
  // Name of the current pipeline stage being executed.
  string stage_name = 1;
  // Number of items processed in the current stage.
  uint32 current = 2;
  // Total number of items to process in the current stage.
  uint32 total = 3;
}

// Mode specifying whether the associated sparse bitset represents matching or excluded items.
enum FilterResultMode {
  FILTER_RESULT_MODE_UNSPECIFIED = 0;
  FILTER_RESULT_MODE_INCLUDE = 1;
  FILTER_RESULT_MODE_EXCLUDE = 2;
}

// Final result containing the sparse bitsets of all timelines and logs that passed the filter pipeline.
message FilterResult {
  // Mode indicating whether timeline_bitset represents matching (INCLUDE) or filtered-out (EXCLUDE) timelines.
  FilterResultMode timeline_mode = 1;
  // Sparse bitset of timeline IDs passing or excluded by the filter pipeline.
  SparseBitset timeline_bitset = 2;
  // Mode indicating whether log_bitset represents matching (INCLUDE) or filtered-out (EXCLUDE) logs.
  FilterResultMode log_mode = 3;
  // Sparse bitset of log IDs passing or excluded by the filter pipeline.
  SparseBitset log_bitset = 4;
}

// Streamed message emitted during FilterTimeline execution.
message FilterTimelineResponse {
  // Payload containing either an intermediate progress notification or the terminal filter result.
  oneof payload {
    FilterProgress progress = 1;
    FilterResult result = 2;
  }
}

// Request to start or poll a timeline and log filter evaluation task.
message FilterTimelineSyncRequest {
  // The active workbench session identifier.
  string workbench_id = 1;
  // CEL expression to filter timelines by path, name, or metadata. Empty string matches all timelines.
  string timeline_query = 2;
  // CEL expression to exclude timelines and their descendants. Empty string excludes none.
  string timeline_exclusion_query = 3;
  // CEL expression to filter log entries within remaining timelines. Empty string matches all logs.
  string log_query = 4;
  // When true, excludes timelines that contain no matching log entries.
  bool exclude_no_logs = 5;
  // Job identifier returned from a previous call, or empty to start a new filter task.
  string job_id = 6;
}

// Response containing current progress or final filter result.
message FilterTimelineSyncResponse {
  // Unique job identifier tracking this filter task.
  string job_id = 1;
  // Whether the filter task has completed.
  bool is_done = 2;
  // Current intermediate progress update.
  FilterProgress progress = 3;
  // Final filter result, populated only when is_done is true.
  FilterResult result = 4;
  // Error message if the filter task failed.
  string error_message = 5;
}

// Request to cancel an ongoing timeline filter task.
message CancelFilterTimelineSyncRequest {
  // The active workbench session identifier.
  string workbench_id = 1;
  // Job identifier of the filter task to cancel.
  string job_id = 2;
}

// Response confirming cancellation of the filter task.
message CancelFilterTimelineSyncResponse {
  // Whether the filter job was found and canceled.
  bool canceled = 1;
}

// Request to close and release a Workbench session immediately.
message CloseWorkbenchRequest {
  string workbench_id = 1;
}

// Response confirming closure of a Workbench session.
message CloseWorkbenchResponse {
  bool closed = 1;
}
