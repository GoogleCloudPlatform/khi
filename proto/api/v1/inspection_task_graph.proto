edition = "2023";

package api.v1;

option go_package = "github.com/GoogleCloudPlatform/khi/pkg/generated/api/v1;apiv1";

// TaskDependencyScope defines the evaluation scope for finding upstream dependency providers.
enum TaskDependencyScope {
  TASK_DEPENDENCY_SCOPE_UNSPECIFIED = 0;
  TASK_DEPENDENCY_SCOPE_ALL = 1;
  TASK_DEPENDENCY_SCOPE_ACTIVE_FEATURES = 2;
  TASK_DEPENDENCY_SCOPE_ACTIVE_GRAPH = 3;
}

// TaskDependencyCardinality specifies whether a dependency is point-to-point or a fan-in aggregation.
enum TaskDependencyCardinality {
  TASK_DEPENDENCY_CARDINALITY_UNSPECIFIED = 0;
  TASK_DEPENDENCY_CARDINALITY_POINT_TO_POINT = 1;
  TASK_DEPENDENCY_CARDINALITY_FAN_IN = 2;
}

// TaskRunPhase represents the execution lifecycle state of a task within an inspection run.
enum TaskRunPhase {
  TASK_RUN_PHASE_UNSPECIFIED = 0;
  TASK_RUN_PHASE_WAITING = 1;
  TASK_RUN_PHASE_RUNNING = 2;
  TASK_RUN_PHASE_DONE = 3;
  TASK_RUN_PHASE_ERROR = 4;
}

// TaskDependencyInfo contains metadata for an individual task dependency requirement.
message TaskDependencyInfo {
  // Cardinality indicates whether this dependency connects a single task or fan-in candidates.
  TaskDependencyCardinality cardinality = 1;

  // Scope restricts candidate selection for this dependency.
  TaskDependencyScope scope = 2;

  // Target task reference ID for point-to-point dependencies.
  string target_reference_id = 3;

  // Target tag name for fan-in aggregation dependencies.
  string target_tag = 4;

  // Expected Go result type for point-to-point or fan-in dependency.
  string output_type = 5;
}

// ProvidedTagInfo details a tag provided by a task implementation.
message ProvidedTagInfo {
  // Tag identifier.
  string tag = 1;

  // Precedence priority during cycle pruning.
  int32 priority = 2;

  // Go output type string of the tag data.
  string output_type = 3;
}

// LabelSelectorRequirementInfo describes a single label matching requirement.
message LabelSelectorRequirementInfo {
  // Label key to evaluate.
  string key = 1;

  // Operator applied to evaluate values (e.g. "In", "NotIn", "Exists", "DoesNotExist").
  string operator = 2;

  // Allowed or forbidden label values.
  repeated string values = 3;
}

// RegisteredTaskInfo details a single registered task implementation.
message RegisteredTaskInfo {
  // Fully-qualified task implementation identifier.
  string task_implementation_id = 1;

  // Logical task reference identifier.
  string task_reference_id = 2;

  // Precedence priority when multiple implementations share the same reference identifier.
  int32 priority = 3;

  // Whether this task acts as a toggleable inspection feature.
  bool is_feature = 4;

  // Whether this feature task is enabled by default for compatible inspection types.
  bool is_default_feature = 5;

  // Display title for feature selection UI if this task is a feature.
  string feature_label = 6;

  // Detailed description for feature selection UI if this task is a feature.
  string feature_description = 7;

  // Upstream dependencies required before this task can execute.
  repeated TaskDependencyInfo dependencies = 8;

  // Label selector requirements constraining compatibility to matching inspection types.
  repeated LabelSelectorRequirementInfo selector_requirements = 9;

  // Raw task labels defined on this implementation.
  map<string, string> labels = 10;

  // Go result type produced by this task implementation.
  string output_type = 11;

  // Tags provided by this task along with their data types.
  repeated ProvidedTagInfo provided_tags = 12;
}

// RegisteredTaskGroupInfo groups task implementations that provide the same reference identifier.
message RegisteredTaskGroupInfo {
  // Shared logical task reference identifier.
  string task_reference_id = 1;

  // All task implementations registered for this reference identifier.
  repeated RegisteredTaskInfo tasks = 2;
}

// RegisteredInspectionTypeInfo provides metadata describing a supported inspection type.
message RegisteredInspectionTypeInfo {
  // Unique inspection type identifier.
  string id = 1;

  // Human-readable title of the inspection type.
  string name = 2;

  // Description of this inspection type and the environments it targets.
  string description = 3;

  // Icon path or resource identifier representing this inspection type.
  string icon = 4;

  // Categorical labels attached to this inspection type used by task label selectors.
  map<string, string> labels = 5;
}

// Request to retrieve all registered tasks and inspection types.
message GetInspectionTaskRegistryRequest {}

// Response containing all registered tasks grouped by reference identifier and all inspection types.
message GetInspectionTaskRegistryResponse {
  // Registered tasks grouped by their logical task reference identifiers.
  repeated RegisteredTaskGroupInfo task_groups = 1;

  // All inspection types available on the server.
  repeated RegisteredInspectionTypeInfo inspection_types = 2;
}

// Request to resolve and debug the task graph for a specific inspection type and feature configuration.
message ResolveInspectionTaskGraphRequest {
  // Target inspection type identifier to evaluate compatibility against.
  string inspection_type_id = 1;

  // Optional manual overrides enabling or disabling specific feature tasks.
  map<string, bool> feature_overrides = 2;
}

// TaskFilterEvaluation details whether a task implementation passed inspection type filtering and priority deduplication.
message TaskFilterEvaluation {
  // Fully-qualified task implementation identifier.
  string task_implementation_id = 1;

  // Logical task reference identifier.
  string task_reference_id = 2;

  // Whether this task implementation matched the target inspection type criteria.
  bool is_compatible = 3;

  // Explanatory diagnosis detailing why this task matched or failed to match.
  string match_reason = 4;

  // Whether this implementation was chosen as the sole active task for its reference identifier.
  bool is_selected = 5;

  // Identifier of the winning task implementation that superseded this task due to higher priority.
  string superseded_by_task_implementation_id = 6;

  // Selection priority value evaluated during deduplication.
  int32 priority = 7;
}

// TaskDAGNode represents an individual task node within the resolved execution DAG.
message TaskDAGNode {
  // Fully-qualified task implementation identifier.
  string task_implementation_id = 1;

  // Logical task reference identifier.
  string task_reference_id = 2;

  // Whether this node represents a feature flag task.
  bool is_feature = 3;

  // Zero-based topological execution order index.
  int32 topological_order = 4;

  // Selection priority associated with this implementation.
  int32 priority = 5;

  // Key-value labels attached to this task.
  map<string, string> labels = 6;

  // Go result type produced by this task implementation.
  string output_type = 7;

  // Tags provided by this task along with their data types.
  repeated ProvidedTagInfo provided_tags = 8;
}

// TaskDAGEdge represents a concrete directed dependency edge between two tasks in the resolved DAG.
message TaskDAGEdge {
  // Implementation identifier of the upstream producer task.
  string source_implementation_id = 1;

  // Implementation identifier of the downstream consumer task.
  string destination_implementation_id = 2;

  // Reference identifier of the upstream task providing the dependency.
  string source_reference_id = 3;

  // Edge cardinality indicating point-to-point or fan-in binding.
  TaskDependencyCardinality cardinality = 4;

  // Tag identifier if this edge originated from a fan-in tag dependency.
  string tag = 5;

  // Edge precedence weight during cycle resolution.
  int32 priority = 6;

  // Go data type transmitted across this dependency edge.
  string output_type = 7;
}

// TaskDAGInfo contains the complete resolved execution graph topology.
message TaskDAGInfo {
  // Whether graph resolution succeeded without cycles or unresolvable dependencies.
  bool is_success = 1;

  // Diagnostic error description if graph resolution failed.
  string error_message = 2;

  // Nodes included in the resolved execution DAG.
  repeated TaskDAGNode nodes = 3;

  // Concrete directed edges connecting tasks in the resolved execution DAG.
  repeated TaskDAGEdge edges = 4;
}

// FeatureToggleInfo provides toggle configuration state for an available feature task.
message FeatureToggleInfo {
  // Implementation identifier of the feature task.
  string task_implementation_id = 1;

  // Human-readable feature name.
  string label = 2;

  // Detailed description of the feature behavior.
  string description = 3;

  // Effective enabled state for this run.
  bool enabled = 4;
}

// Response containing filtering diagnostic evaluations and the resolved DAG execution plan.
message ResolveInspectionTaskGraphResponse {
  // Detailed evaluations for all candidate task implementations against the inspection type.
  repeated TaskFilterEvaluation filtering_evaluations = 1;

  // Resolved DAG execution plan.
  TaskDAGInfo dag = 2;

  // Toggleable features available under the selected inspection type.
  repeated FeatureToggleInfo available_features = 3;
}

// TaskRunNodeStatus reports the execution state of a single task within a running inspection.
message TaskRunNodeStatus {
  // Implementation identifier of the task this status belongs to.
  string task_implementation_id = 1;

  // Current execution phase of the task.
  TaskRunPhase phase = 2;

  // Wall clock time the task started, or zero while the task is still waiting.
  int64 start_time_unix_nano = 3;

  // Wall clock time the task reached a terminal phase, or zero while it is waiting or running.
  int64 end_time_unix_nano = 4;
}

// InspectionRunTaskGraphSnapshot is a point-in-time view of an inspection run used to visualize its progress.
message InspectionRunTaskGraphSnapshot {
  // Execution graph the inspection run is currently processing.
  TaskDAGInfo dag = 1;

  // Execution state of every task in the graph, including tasks that have not started yet.
  repeated TaskRunNodeStatus node_statuses = 2;

  // Whether the inspection run already reached its terminal state.
  bool is_run_finished = 3;

  // Server-side capture time, allowing clients to derive elapsed time without relying on their own clock.
  int64 snapshot_time_unix_nano = 4;
}

// Request to observe the task graph progress of a single inspection run.
message WatchInspectionRunTaskGraphRequest {
  // Identifier of the inspection run to observe.
  string inspection_id = 1;
}

// Response streaming the latest progress snapshot of an inspection run.
message WatchInspectionRunTaskGraphResponse {
  // Latest snapshot of the inspection run.
  InspectionRunTaskGraphSnapshot snapshot = 1;
}

// Request to fetch the current task graph progress of a single inspection run.
message PullInspectionRunTaskGraphRequest {
  // Identifier of the inspection run to read.
  string inspection_id = 1;
}

// Response carrying the current progress snapshot of an inspection run.
message PullInspectionRunTaskGraphResponse {
  // Current snapshot of the inspection run.
  InspectionRunTaskGraphSnapshot snapshot = 1;
}

// InspectionTaskGraphService provides diagnostic APIs to inspect task registration, filtering, and DAG resolution.
service InspectionTaskGraphService {
  // Returns all registered tasks in the server grouped by reference identifier, along with available inspection types.
  rpc GetInspectionTaskRegistry(GetInspectionTaskRegistryRequest) returns (GetInspectionTaskRegistryResponse);

  // Resolves the inspection task graph for a given inspection type and feature configuration,
  // returning step-by-step filtering results and the resolved execution DAG.
  rpc ResolveInspectionTaskGraph(ResolveInspectionTaskGraphRequest) returns (ResolveInspectionTaskGraphResponse);

  // Streams progress snapshots of the task graph executed by an inspection run.
  rpc WatchInspectionRunTaskGraph(WatchInspectionRunTaskGraphRequest) returns (stream WatchInspectionRunTaskGraphResponse);

  // Returns a single progress snapshot of an inspection run for hosting environments without streaming support.
  rpc PullInspectionRunTaskGraph(PullInspectionRunTaskGraphRequest) returns (PullInspectionRunTaskGraphResponse);
}
