edition = "2023";

package api.v1;

option go_package = "github.com/GoogleCloudPlatform/khi/pkg/generated/api/v1;apiv1";

// Request to validate a CEL timeline filter query syntax and types.
message ValidateTimelineQueryRequest {
  string query = 1;
}

// Response indicating whether the timeline CEL query is valid.
message ValidateTimelineQueryResponse {
  bool valid = 1;
  string error_message = 2;
}

// Request to validate a CEL log filter query syntax and types.
message ValidateLogQueryRequest {
  string query = 1;
}

// Response indicating whether the log CEL query is valid.
message ValidateLogQueryResponse {
  bool valid = 1;
  string error_message = 2;
}

// CELValidationService provides stateless CEL expression syntax and type validation.
service CELValidationService {
  // Validates a timeline CEL query expression against registered schemas and custom functions.
  rpc ValidateTimelineQuery(ValidateTimelineQueryRequest) returns (ValidateTimelineQueryResponse);

  // Validates a log CEL query expression against registered schemas and custom functions.
  rpc ValidateLogQuery(ValidateLogQueryRequest) returns (ValidateLogQueryResponse);
}
