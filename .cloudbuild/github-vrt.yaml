substitutions:
  _VRT_BUCKET: "khi-vrt-artifacts"
  _VRT_ACCESS_MODE: "console"
  _VRT_WORKERS: "8"
  _FAIL_ON_DIFF: "false"
  _FORCE_FULL: "false"

steps:
  - name: "gcr.io/kubernetes-history-inspector/builder:latest"
    id: frontend-vrt
    entrypoint: make
    env:
      - "BASE_BRANCH=${_BASE_BRANCH}"
      - "PR_NUMBER=${_PR_NUMBER}"
      - "COMMIT_SHA=${COMMIT_SHA}"
      - "PROJECT_ID=${PROJECT_ID}"
      - "BUILD_ID=${BUILD_ID}"
      - "LOCATION=${LOCATION}"
      - "VRT_MODE=compare"
      - "VRT_BUCKET=${_VRT_BUCKET}"
      - "VRT_ACCESS_MODE=${_VRT_ACCESS_MODE}"
      - "VRT_WORKERS=${_VRT_WORKERS}"
      - "VRT_FAIL_ON_DIFF=${_FAIL_ON_DIFF}"
      - "VRT_FORCE_FULL=${_FORCE_FULL}"
    args:
      - "vrt-ci"

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
serviceAccount: >-
  projects/kubernetes-history-inspector/serviceAccounts/oss-khi-cicd@kubernetes-history-inspector.iam.gserviceaccount.com
