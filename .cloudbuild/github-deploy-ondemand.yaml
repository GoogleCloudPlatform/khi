substitutions:
  _VERSION: "dev-${SHORT_SHA}"
  # TODO(#21): Remove asia.gcr.io from the build targets.
  # The new repository is gcr.io, but we will keep the old one for a while.
  _DOCKER_TAGS: "-t gcr.io/kubernetes-history-inspector/develop:${COMMIT_SHA}"
  _DOCKER_SLIM_TAGS: "-t gcr.io/kubernetes-history-inspector/develop:${COMMIT_SHA}-slim"

steps:
  - name: "gcr.io/cloud-builders/gcloud"
    id: cancel_superseded
    entrypoint: bash
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "BUILD_ID=${BUILD_ID}"
      - "LOCATION=${LOCATION}"
      - "PR_NUMBER=${_PR_NUMBER}"
      - "COMMIT_SHA=${COMMIT_SHA}"
    args:
      - "./scripts/cancel-superseded-cloudbuild.sh"
  - name: "gcr.io/kubernetes-history-inspector/builder:latest"
    args:
      - "-c"
      - |
        cd ./web
        npm ci
    id: install_deps
    waitFor:
      - cancel_superseded
    entrypoint: /bin/bash
  - name: "gcr.io/kubernetes-history-inspector/builder:latest"
    args:
      - "-c"
      - |
        echo "${_VERSION}" > VERSION
        make build-web
    id: build_app
    waitFor:
      - install_deps
    entrypoint: /bin/bash
  - name: gcr.io/cloud-builders/docker
    args:
      - "-c"
      - |
        set -euo pipefail
        DOCKER_BUILDKIT=1 docker build --platform=linux/amd64 --file=./Dockerfile --target=default ${_DOCKER_TAGS} .
        DOCKER_BUILDKIT=1 docker build --platform=linux/amd64 --file=./Dockerfile --target=slim ${_DOCKER_SLIM_TAGS} .
        for arg in ${_DOCKER_TAGS} ${_DOCKER_SLIM_TAGS}; do
          if [[ "$$arg" != "-t" ]]; then
            docker push "$$arg"
          fi
        done
    id: build_container
    waitFor:
      - build_app
    entrypoint: /bin/bash
options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
serviceAccount: >-
  projects/kubernetes-history-inspector/serviceAccounts/oss-khi-cicd@kubernetes-history-inspector.iam.gserviceaccount.com
