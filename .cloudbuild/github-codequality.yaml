substitutions:
  _MAX_MUTANTS: "0"
  _TIMEOUT: "10m"
  _SIMILARITY: "true"

steps:
  - name: "gcr.io/kubernetes-history-inspector/builder:latest"
    id: codequality
    entrypoint: make
    env:
      - "BASE_BRANCH=${_BASE_BRANCH}"
      - "PR_NUMBER=${_PR_NUMBER}"
      - "CODEQUALITY_MAX=${_MAX_MUTANTS}"
      - "CODEQUALITY_TIMEOUT=${_TIMEOUT}"
      - "CODEQUALITY_SIMILARITY=${_SIMILARITY}"
      - "CODEQUALITY_SIMILARITY_PROJECT=${PROJECT_ID}"
    args:
      - "codequality-ci"

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
serviceAccount: >-
  projects/kubernetes-history-inspector/serviceAccounts/oss-khi-cicd@kubernetes-history-inspector.iam.gserviceaccount.com
