@if (visible()) {
  <div class="index-progress-card">
    <div class="header-row">
      <div class="title-group">
        <mat-icon
          class="status-icon"
          [class.ready]="isReady()"
          [svgIcon]="isReady() ? 'check_circle' : 'sync'"
        ></mat-icon>
        <span class="title">{{
          isReady() ? "Search Index Ready" : "Building Search Index"
        }}</span>
      </div>
      <span class="percentage">{{ percent() | number: "1.0-0" }}%</span>
    </div>
    <mat-progress-bar
      class="progress-bar"
      [mode]="'determinate'"
      [value]="percent()"
    ></mat-progress-bar>
    @if (message()) {
      <div class="message">{{ message() }}</div>
    }
  </div>
}
