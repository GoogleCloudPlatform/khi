<div class="code-viewer-container">
  @if (title()) {
    <div class="code-viewer-header">
      <span class="code-viewer-title">{{ title() }}</span>
      <div class="actions-section">
        <button
          mat-icon-button
          class="copy-button"
          [cdkCopyToClipboard]="code()"
          (cdkCopyToClipboardCopied)="onCopied()"
          [matTooltip]="isCopied() ? 'Copied!' : 'Copy to clipboard'"
        >
          <mat-icon>{{ isCopied() ? "check" : "content_copy" }}</mat-icon>
        </button>
      </div>
    </div>
  } @else {
    <div class="floating-header">
      <button
        mat-icon-button
        class="copy-button"
        [cdkCopyToClipboard]="code()"
        (cdkCopyToClipboardCopied)="onCopied()"
        [matTooltip]="isCopied() ? 'Copied!' : 'Copy to clipboard'"
      >
        <mat-icon>{{ isCopied() ? "check" : "content_copy" }}</mat-icon>
      </button>
    </div>
  }
  <pre
    class="code-content"
    [style.max-height]="maxHeight()"
  ><code>{{ code() }}</code></pre>
</div>
