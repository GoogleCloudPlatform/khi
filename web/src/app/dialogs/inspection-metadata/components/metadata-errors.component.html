<div class="errors-container">
  @for (error of errors(); track error.errorId + "-" + $index) {
    <div class="error-card">
      <div class="error-header">
        <mat-icon class="error-icon">error</mat-icon>
        <span class="error-id">{{ error.errorId }}</span>
      </div>
      <div class="error-message">{{ error.message }}</div>
      @if (error.link) {
        <div class="error-link-container">
          <a
            class="error-link"
            [href]="error.link"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>Troubleshooting Documentation</span>
            <mat-icon class="link-icon">open_in_new</mat-icon>
          </a>
        </div>
      }
    </div>
  }
</div>
