<h2 mat-dialog-title>Start from Job Command</h2>

<mat-dialog-content>
  <p class="dialog-description">
    Paste the KHI job mode CLI command line to configure and run the inspection.
  </p>

  <mat-form-field appearance="outline" class="command-textarea-field">
    <mat-label>Job Mode Command</mat-label>
    <textarea
      matInput
      rows="10"
      placeholder='./khi --job-mode --job-inspection-type="..." --job-inspection-features="..." --job-inspection-values=&apos;{...}&apos;'
      [(ngModel)]="command"
    ></textarea>
  </mat-form-field>

  @if (errorMessage(); as err) {
    <div class="error-callout">
      <mat-icon>error</mat-icon>
      <span>{{ err }}</span>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelDialog.emit()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="isSubmitDisabled()"
    (click)="submitCommand.emit()"
  >
    Run
  </button>
</mat-dialog-actions>
