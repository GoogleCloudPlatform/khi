<div class="dialog-container">
  <header class="dialog-header">
    <div class="header-title">
      <mat-icon class="header-icon">account_tree</mat-icon>
      <h2 class="inspection-name">{{ viewModel().inspectionName }}</h2>
      <span class="run-state">{{ runStateLabel() }}</span>
    </div>
    <div class="header-summary">
      <span class="progress-label">{{ progressLabel() }}</span>
      <div class="progress-track">
        <div
          class="progress-value"
          [style.width.%]="progressPercentage()"
        ></div>
      </div>
      <span class="elapsed-label">{{ elapsedLabel() }}</span>
    </div>
  </header>

  @if (viewModel().watchErrorMessage !== "") {
    <p class="error-banner">
      <mat-icon class="error-icon">error</mat-icon>
      <span>{{ viewModel().watchErrorMessage }}</span>
    </p>
  }

  <div class="legend-bar">
    <khi-dag-run-phase-legend />
  </div>

  <div class="canvas-area">
    @if (viewModel().nodes.length > 0) {
      <khi-dag-canvas
        [nodes]="viewModel().nodes"
        [edges]="viewModel().edges"
        [showDetailPanel]="false"
      />
    }
  </div>
</div>
