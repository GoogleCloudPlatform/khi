<div class="dag-canvas-root">
  <div class="dag-toolbar">
    <div class="zoom-controls">
      <button
        mat-icon-button
        class="toolbar-btn"
        (click)="zoomIn()"
        title="Zoom In"
      >
        <mat-icon>zoom_in</mat-icon>
      </button>
      <span class="zoom-level">{{ zoomPercentage() }}</span>
      <button
        mat-icon-button
        class="toolbar-btn"
        (click)="zoomOut()"
        title="Zoom Out"
      >
        <mat-icon>zoom_out</mat-icon>
      </button>
      <button
        mat-icon-button
        class="toolbar-btn"
        (click)="resetZoom()"
        title="Reset Zoom"
      >
        <mat-icon>restart_alt</mat-icon>
      </button>
      <button
        mat-icon-button
        class="toolbar-btn"
        (click)="fitToView()"
        title="Fit to Screen"
      >
        <mat-icon>fit_screen</mat-icon>
      </button>
    </div>
    <div class="status-info">
      <span class="stat-item">{{ layoutResult().nodes.length }} Nodes</span>
      <span class="stat-separator">|</span>
      <span class="stat-item"
        >{{ layoutResult().edges.length }} Dependencies</span
      >
    </div>
  </div>

  <div class="dag-workspace">
    <div
      #canvasContainer
      class="canvas-viewport"
      [class.dragging]="isDragging()"
      (mousedown)="onMouseDown($event)"
      (mousemove)="onMouseMove($event)"
      (mouseup)="onMouseUp()"
      (mouseleave)="onMouseUp()"
      (wheel)="onWheel($event)"
    >
      <svg class="dag-svg" width="100%" height="100%">
        <defs>
          <marker
            id="arrow-marker"
            viewBox="0 0 10 10"
            refX="6"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#79747e" />
          </marker>
          <marker
            id="arrow-marker-highlighted"
            viewBox="0 0 10 10"
            refX="6"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3f51b5" />
          </marker>
          <marker
            id="arrow-marker-fan-in"
            viewBox="0 0 10 10"
            refX="6"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7b1fa2" />
          </marker>
          <marker
            id="arrow-marker-satisfied"
            viewBox="0 0 10 10"
            refX="6"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse"
          >
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#388e3c" />
          </marker>
        </defs>

        <g class="dag-content-group" [attr.transform]="transformString()">
          <!-- Edges layer rendered below nodes -->
          <g class="dag-edges-layer">
            @for (edge of layoutResult().edges; track edge.id) {
              <g
                khi-dag-edge
                [edge]="edge"
                [isHighlighted]="isEdgeHighlighted(edge.id)"
                [isDimmed]="isEdgeDimmed(edge.id)"
                [isSatisfied]="isEdgeSatisfied(edge.id)"
              ></g>
            }
          </g>

          <!-- Nodes layer rendered above edges -->
          <g class="dag-nodes-layer">
            @for (node of layoutResult().nodes; track node.id) {
              <g
                khi-dag-node
                [node]="node"
                [isSelected]="selectedNodeId() === node.id"
                [isHighlighted]="isNodeHighlighted(node.id)"
                [isDimmed]="isNodeDimmed(node.id)"
                (selectNode)="onNodeSelected($event.id)"
              ></g>
            }
          </g>
        </g>
      </svg>
    </div>

    @if (showDetailPanel() && selectedNode()) {
      <khi-dag-node-detail-panel
        class="dag-detail-dock"
        [node]="selectedNode()"
        [upstreamNodes]="selectedUpstreamNodes()"
        [downstreamNodes]="selectedDownstreamNodes()"
        (closePanel)="closeDetailPanel()"
        (selectNode)="onNodeSelected($event)"
      />
    }
  </div>
</div>
