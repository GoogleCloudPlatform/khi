<div class="toolbar-container">
  <div class="slider-section">
    <span
      class="slider-label"
      matTooltip="Duration to keep deleted resources visible on the graph"
      >Retention period: {{ formattedDeletionThreshold() }}</span
    >
    <mat-slider
      class="threshold-slider"
      [min]="minDeletionThresholdSeconds"
      [max]="maxDeletionThresholdSeconds"
      [step]="stepDeletionThresholdSeconds"
      [disabled]="isLoading()"
    >
      <input matSliderThumb [(value)]="deletionThresholdSeconds" />
    </mat-slider>
  </div>

  <button
    matIconButton
    class="toolbar-button fit-button"
    matTooltip="Fit to view"
    [disabled]="isLoading()"
    (click)="fitToView.emit()"
  >
    <mat-icon>fit_screen</mat-icon>
  </button>

  <button
    matIconButton
    class="toolbar-button download-button"
    matTooltip="Download graph"
    [disabled]="isLoading()"
    [matMenuTriggerFor]="downloadMenu"
  >
    <mat-icon>download</mat-icon>
  </button>
</div>

<mat-menu #downloadMenu="matMenu">
  <button mat-menu-item (click)="downloadSvg.emit()">
    <mat-icon>code</mat-icon>
    <span>Download as SVG</span>
  </button>
  <button mat-menu-item (click)="downloadPng.emit()">
    <mat-icon>image</mat-icon>
    <span>Download as PNG</span>
  </button>
</mat-menu>
