<form
  (submit)="onConfirm(); $event.preventDefault()"
  class="filter-builder-card"
>
  <div class="header-container">
    <h3 class="title">Time Range Filter</h3>
    @if (showDeleteButton()) {
      <button
        mat-icon-button
        color="warn"
        class="delete-btn"
        type="button"
        (click)="deleteButtonClicked.emit()"
        matTooltip="Clear Time Filter"
      >
        <mat-icon>delete</mat-icon>
      </button>
    }
  </div>

  <div class="form-fields-wrapper">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Start Time</mat-label>
      <input
        #startInput
        matInput
        placeholder="YYYY-MM-DDTHH:mm:ss.SSS"
        [value]="startInputText()"
        (input)="startInputText.set(startInput.value)"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>End Time</mat-label>
      <input
        #endInput
        matInput
        placeholder="YYYY-MM-DDTHH:mm:ss.SSS"
        [value]="endInputText()"
        (input)="endInputText.set(endInput.value)"
      />
    </mat-form-field>
  </div>

  @if (validationError()) {
    <div class="error-message">{{ validationError() }}</div>
  }

  <div class="actions">
    <button mat-button type="button" (click)="closeButtonClicked.emit()">
      Cancel
    </button>
    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="isConfirmDisabled()"
    >
      Apply
    </button>
  </div>
</form>
