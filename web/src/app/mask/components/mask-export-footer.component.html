<div class="pane-footer">
  @if (exportProgress(); as progress) {
    <div class="export-progress-banner">
      <div class="export-progress-top">
        <div class="export-progress-label">
          <mat-icon class="export-progress-icon">{{
            exportPhaseIcon()
          }}</mat-icon>
          <span>{{ progress.phaseLabel }}</span>
        </div>
        <span class="export-progress-percent"
          >{{ roundedExportProgress() }}%</span
        >
      </div>
      <mat-progress-bar
        class="export-progress-bar"
        mode="determinate"
        [value]="progress.progressPercentage"
      ></mat-progress-bar>
      @if (progress.message) {
        <div class="export-progress-message">{{ progress.message }}</div>
      }
    </div>
  } @else if (errorMessage()) {
    <div class="footer-feedback error">{{ errorMessage() }}</div>
  } @else if (statusMessage()) {
    <div class="footer-feedback status">{{ statusMessage() }}</div>
  }
  <div class="footer-actions">
    <button
      mat-button
      class="clear-btn"
      type="button"
      [disabled]="!canClearAll()"
      (click)="clearAllRules.emit()"
    >
      Clear All
    </button>
    <button
      mat-flat-button
      color="primary"
      class="export-btn"
      type="button"
      [disabled]="!canExport()"
      (click)="exportMaskedKhi.emit()"
    >
      <span>{{ exportButtonLabel() }}</span>
    </button>
  </div>
</div>
