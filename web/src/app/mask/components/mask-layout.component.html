<div class="mask-pane">
  <div class="pane-header">
    <div class="header-title-group">
      <mat-icon class="header-icon">visibility_off</mat-icon>
      <span class="header-title">Mask Sensitive Strings</span>
    </div>
    <mat-slide-toggle
      class="preview-toggle"
      color="primary"
      [checked]="livePreviewEnabled()"
      (change)="livePreviewChange.emit($event.checked)"
    >
      Live preview
    </mat-slide-toggle>
  </div>

  @if (!isWorkbenchActive()) {
    <div class="empty-workbench">
      <mat-icon class="empty-icon">folder_off</mat-icon>
      <p class="empty-title">No inspection loaded</p>
      <p class="empty-description">
        Open an inspection dataset to browse strings, preview masks, and export
        a sanitized .khi file.
      </p>
    </div>
  } @else {
    <khi-mask-index-banner
      class="status-banners"
      [indexStatus]="indexStatus()"
    ></khi-mask-index-banner>

    <mat-tab-group class="mask-tabs" animationDuration="0ms">
      <mat-tab label="String Pool">
        <khi-mask-string-pool
          class="tab-panel"
          [searchQuery]="searchQuery()"
          [searchRegexError]="searchRegexError()"
          [candidates]="candidates()"
          [totalCandidateCount]="totalCandidateCount()"
          [isLoadingCandidates]="isLoadingCandidates()"
          (searchQueryChange)="searchQueryChange.emit($event)"
          (selectShownCandidates)="selectShownCandidates.emit()"
          (loadMoreCandidates)="loadMoreCandidates.emit()"
          (candidateToggle)="candidateToggle.emit($event)"
          (addCustomSubstring)="addCustomSubstring.emit($event)"
        ></khi-mask-string-pool>
      </mat-tab>

      <mat-tab [label]="selectedMasksTabLabel()">
        <khi-mask-rule-list
          class="tab-panel"
          [rules]="rules()"
          (ruleEnabledChange)="ruleEnabledChange.emit($event)"
          (ruleReplacementChange)="ruleReplacementChange.emit($event)"
          (ruleResetReplacement)="ruleResetReplacement.emit($event)"
          (ruleRemove)="ruleRemove.emit($event)"
        ></khi-mask-rule-list>
      </mat-tab>
    </mat-tab-group>

    <khi-mask-export-footer
      class="footer-area"
      [ruleCount]="rules().length"
      [enabledRuleCount]="enabledRuleCount()"
      [isExporting]="isExporting()"
      [exportProgress]="exportProgress()"
      [statusMessage]="statusMessage()"
      [errorMessage]="errorMessage()"
      (clearAllRules)="clearAllRules.emit()"
      (exportMaskedKhi)="exportMaskedKhi.emit()"
    ></khi-mask-export-footer>
  }
</div>
