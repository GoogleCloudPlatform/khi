<svg:path
  class="edge-path"
  [attr.d]="edge().pathD"
  [attr.marker-end]="markerUrl()"
/>
@if (edge().tag) {
  <svg:g class="edge-tag-group" [attr.transform]="tagTransform()">
    <svg:title>{{ edge().tag }}</svg:title>
    <svg:rect
      class="tag-badge-bg"
      [attr.x]="tagBadgeX()"
      [attr.y]="tagBadgeY()"
      [attr.width]="tagBadgeWidth()"
      [attr.height]="tagBadgeHeight()"
      [attr.rx]="tagBadgeRx()"
    />
    @if (tagDomain()) {
      <svg:text class="tag-domain-text" text-anchor="middle" y="-3">
        {{ tagDomain() }}
      </svg:text>
      <svg:text class="tag-name-text" text-anchor="middle" y="9">
        {{ tagName() }}
      </svg:text>
    } @else {
      <svg:text
        class="tag-name-text single-line"
        text-anchor="middle"
        dominant-baseline="central"
      >
        {{ tagName() }}
      </svg:text>
    }
  </svg:g>
}
