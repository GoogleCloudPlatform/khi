changelog:
  categories:
    - title: New features 🎉
      labels:
        - type:feature
    - title: Bug Fixes 🐛
      labels:
        - type:bug
    - title: Performance Improvements ⚡
      labels:
        - type:perf
    - title: Refactoring ♻️
      labels:
        - type:refactor
    - title: CI/CD ⚙️
      labels:
        - area:cicd
    - title: Development Environment 💻
      labels:
        - area:devenv
    - title: Documentation 📝
      labels:
        - type:docs
    - title: Other Changes 🛠
      labels:
        - "*"
      exclude:
        labels:
          - type:feature
          - type:bug
          - type:perf
          - type:refactor
          - area:cicd
          - area:devenv
          - type:docs
          - dependencies
          - type:chore
    - title: Maintenance 🧹
      labels:
        - type:chore
    - title: Dependencies ⏫
      labels:
        - dependencies
