name: Code Quality PR Comment

on:
  check_run:
    types: [completed]

jobs:
  post-comment:
    if: >-
      github.event.check_run.app.slug == 'google-cloud-build' &&
      startsWith(github.event.check_run.name, 'github-codequality')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - name: Check out comment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Post or update sticky PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ github.event.check_run.id }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          CONCLUSION: ${{ github.event.check_run.conclusion }}
          DETAILS_URL: ${{ github.event.check_run.details_url }}
        run: /bin/bash ./scripts/post-codequality-pr-comment.sh
