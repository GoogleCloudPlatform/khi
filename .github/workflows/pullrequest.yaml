name: PR Tests

on:
  pull_request:
    branches:
      - "main"
      - epic/**
  merge_group:
    branches:
      - "main"
      - epic/**

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      # Building frontend artifacts because that is used in embed.fs in Go.
      - name: npm install
        working-directory: ./web
        run: npm ci
      - name: Build web
        run: make build-web

      - name: Backend Test
        run: |
          make generate-backend
          go test ./... -args -skip-cloud-logging=true
      - name: Backend Format and Lint Check
        run: |
          make check-format-misc
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --config=.golangci.yaml
  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "./.node-version"

      - name: Set up Go # Go dependency is needed for `make generate-frontend`
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: npm install
        working-directory: ./web
        run: npm ci

      - name: Generate frontend codes
        run: make generate-frontend

      - name: Install Chrome for Angular Test
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Angular Test
        run: make coverage-web

      - name: Frontend Format and Lint Check
        run: |
          make check-format-web
          make lint-web

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    strategy:
      matrix:
        configuration: [prod, dev]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "./.node-version"

      - name: Set up Go # Go dependency is needed for `make generate-frontend`
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"

      - name: npm install
        working-directory: ./web
        run: npm ci

      - name: Generate frontend codes
        run: make generate-frontend

      - name: Build web
        working-directory: ./web
        run: npx ng build --configuration ${{ matrix.configuration }}

      - name: Build Storybook
        working-directory: ./web
        run: npm run build-storybook
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "./.node-version"
      - name: npm install
        working-directory: ./web
        run: npm ci
      - name: Build binary
        run: make build-go-binaries

  license-header-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"

      - name: Install addlicense package
        run: go mod download

      - name: Run addlicense
        id: license_header_check
        run: go tool addlicense  -c "Google LLC" -l apache -v -check .

  proto-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "./.node-version"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"

      - name: npm install (web)
        working-directory: ./web
        run: npm ci

      - name: Run Proto Lint
        run: make lint-proto

      - name: Run Proto Build (Generate)
        run: make build-proto
