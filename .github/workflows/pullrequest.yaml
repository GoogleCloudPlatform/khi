name: PR Tests

on:
  pull_request:
    branches:
      - "main"
      - epic/**
  merge_group:
    branches:
      - "main"
      - epic/**

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache frontend build
        id: cache-frontend-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pkg/server/dist
          key: frontend-build-${{ runner.os }}-${{ hashFiles('web/src/**', 'web/package-lock.json', 'web/angular-template.json', 'web/tsconfig*.json', 'web/.browserslistrc', 'proto/**', 'buf.gen.yaml', 'pkg/model/enum/**', 'pkg/task/inspection/**', 'scripts/generate-angular-json.sh', 'scripts/generate-version.sh', 'scripts/frontend-codegen/**', 'scripts/fontlist-gen/**', 'scripts/msdf-generator/**', '.node-version', 'VERSION') }}

      - name: Set up Go
        if: steps.cache-frontend-build.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: Set up Node.js
        if: steps.cache-frontend-build.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "./.node-version"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Cache woff2_decompress binary
        if: steps.cache-frontend-build.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/msdf-generator/vendor/woff2/woff2_decompress
          key: woff2-bin-${{ runner.os }}-${{ hashFiles('scripts/msdf-generator/setup.sh') }}

      - name: Cache font atlas
        if: steps.cache-frontend-build.outputs.cache-hit != 'true'
        id: cache-font-atlas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/src/assets/zzz-*
            pkg/model/khifile/v6/style/assets
            scripts/msdf-generator/zzz_generated_used_icons.json
            scripts/make/generate-font-atlas.done
            scripts/make/msdf-setup.done
          key: font-atlas-${{ runner.os }}-${{ hashFiles('scripts/msdf-generator/**', 'scripts/fontlist-gen/**', 'pkg/task/inspection/**') }}

      - name: Touch font atlas dummy
        if: steps.cache-frontend-build.outputs.cache-hit != 'true' && steps.cache-font-atlas.outputs.cache-hit == 'true'
        run: touch scripts/make/generate-font-atlas.done scripts/make/msdf-setup.done

      - name: npm install
        if: steps.cache-frontend-build.outputs.cache-hit != 'true'
        working-directory: ./web
        run: npm ci

      - name: Build web
        if: steps.cache-frontend-build.outputs.cache-hit != 'true'
        run: make build-web

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: pkg/server/dist
          retention-days: 1

  backend-tests:
    runs-on: ubuntu-latest
    needs: [build-web]
    permissions:
      contents: "read"
      id-token: "write"
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: Download frontend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: pkg/server/dist

      - name: Touch frontend build artifact dummy
        run: touch pkg/server/dist/browser/build-web.done

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "./.node-version"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Backend Test
        run: |
          make generate-backend
          go test ./... -args -skip-cloud-logging=true
      - name: Backend Format and Lint Check
        run: |
          make check-format-misc
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --config=.golangci.yaml
  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "./.node-version"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Set up Go # Go dependency is needed for `make generate-frontend`
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: npm install
        working-directory: ./web
        run: npm ci

      - name: Cache woff2_decompress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/msdf-generator/vendor/woff2/woff2_decompress
          key: woff2-bin-${{ runner.os }}-${{ hashFiles('scripts/msdf-generator/setup.sh') }}

      - name: Cache font atlas
        id: cache-font-atlas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/src/assets/zzz-*
            pkg/model/khifile/v6/style/assets
            scripts/msdf-generator/zzz_generated_used_icons.json
            scripts/make/generate-font-atlas.done
            scripts/make/msdf-setup.done
          key: font-atlas-${{ runner.os }}-${{ hashFiles('scripts/msdf-generator/**', 'scripts/fontlist-gen/**', 'pkg/task/inspection/**') }}

      - name: Touch font atlas dummy
        if: steps.cache-font-atlas.outputs.cache-hit == 'true'
        run: touch scripts/make/generate-font-atlas.done scripts/make/msdf-setup.done

      - name: Generate frontend codes
        run: make generate-frontend

      - name: Install Chrome for Angular Test
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Angular Test
        run: make coverage-web

      - name: Frontend Format and Lint Check
        run: |
          make check-format-web
          make lint-web

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    strategy:
      matrix:
        configuration: [prod, dev]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "./.node-version"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Set up Go # Go dependency is needed for `make generate-frontend`
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: npm install
        working-directory: ./web
        run: npm ci

      - name: Cache woff2_decompress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/msdf-generator/vendor/woff2/woff2_decompress
          key: woff2-bin-${{ runner.os }}-${{ hashFiles('scripts/msdf-generator/setup.sh') }}

      - name: Cache font atlas
        id: cache-font-atlas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/src/assets/zzz-*
            pkg/model/khifile/v6/style/assets
            scripts/msdf-generator/zzz_generated_used_icons.json
            scripts/make/generate-font-atlas.done
            scripts/make/msdf-setup.done
          key: font-atlas-${{ runner.os }}-${{ hashFiles('scripts/msdf-generator/**', 'scripts/fontlist-gen/**', 'pkg/task/inspection/**') }}

      - name: Touch font atlas dummy
        if: steps.cache-font-atlas.outputs.cache-hit == 'true'
        run: touch scripts/make/generate-font-atlas.done scripts/make/msdf-setup.done

      - name: Generate frontend codes
        run: make generate-frontend

      - name: Build web
        working-directory: ./web
        run: npx ng build --configuration ${{ matrix.configuration }}

      - name: Build Storybook
        working-directory: ./web
        run: npm run build-storybook
  build-binaries:
    runs-on: ubuntu-latest
    needs: [build-web]
    permissions:
      contents: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: Download frontend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: pkg/server/dist

      - name: Touch frontend build artifact dummy
        run: touch pkg/server/dist/browser/build-web.done

      - name: Build binary
        run: make build-go-binaries

  license-header-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install addlicense package
        run: go mod download

      - name: Run addlicense
        id: license_header_check
        run: go tool addlicense  -c "Google LLC" -l apache -v -check .

  proto-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "./.node-version"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: npm install (web)
        working-directory: ./web
        run: npm ci

      - name: Run Proto Lint
        run: make lint-proto

      - name: Run Proto Build (Generate)
        run: make build-proto
