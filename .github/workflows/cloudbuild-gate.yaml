name: Cloud Build Gate

on:
  merge_group:
  check_run:
    types: [created, completed]

permissions: {}

jobs:
  cloudbuild-gate:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Pass gate in merge queue
        run: echo "Cloud Build PR checks already passed before entering the merge queue."

  sync-pr-gate:
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'google-cloud-build' &&
      (startsWith(github.event.check_run.name, 'github-codequality') ||
       startsWith(github.event.check_run.name, 'github-deploy-ondemand'))
    runs-on: ubuntu-latest
    concurrency:
      group: cloudbuild-gate-${{ github.event.check_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Sync cloudbuild-gate Check Run on PR commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
        run: bash ./scripts/sync-cloudbuild-gate.sh
